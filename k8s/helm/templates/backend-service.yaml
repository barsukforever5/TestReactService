apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-react-service.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "test-react-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "test-react-service.selectorLabels" . | nindent 4 }}
