# Default values for test-react-service.
# This is a YAML-formatted file.

replicaCount:
  backend: 1
  frontend: 1

# ----------------------------------------
# Backend (Spring Boot on Tomcat)
# ----------------------------------------
backend:
  image:
    repository: test-react-service-backend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    limits:
      memory: "1Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "250m"

  # Spring Boot / ArangoDB configuration
  config:
    springmvc:
      view:
        prefix: "/WEB-INF/jsp/"
        suffix: ".jsp"
    arangodb:
      host: "arangodb.arango.svc.cluster.local"
      port: 8529
      user: "root"
      password: "root"

# ----------------------------------------
# Frontend (React + Nginx)
# ----------------------------------------
frontend:
  image:
    repository: test-react-service-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    limits:
      memory: "256Mi"
      cpu: "500m"
    requests:
      memory: "128Mi"
      cpu: "100m"

  # Ingress / External access
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    host: test-react-service.local
    tls: []
    # - secretName: test-react-service-tls
    #   hosts:
    #     - test-react-service.local

# ----------------------------------------
# Global
# ----------------------------------------
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
